<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, orientation=landscape">
    <title>Maxi Math Adventure</title>
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Service Worker Registration -->
    <script>
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(registration => {
            console.log('SW registered: ', registration);
        }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
        });
    });
    }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --warning-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --surface: rgba(255, 255, 255, 0.1);
            --surface-hover: rgba(255, 255, 255, 0.2);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--primary-gradient);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: backgroundFloat 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 15px 30px;
            box-shadow: var(--shadow);
        }

        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #fff, #f0f8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-button {
            background: var(--warning-gradient);
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        /* Left Panel - Controls */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .voice-control {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--success-gradient);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
            overflow: hidden;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button i {
            font-size: 3rem;
            color: white;
            z-index: 2;
        }

        .mic-button.listening {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .mic-button.listening::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: ripple 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(56, 239, 125, 0); }
        }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        .voice-status {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .voice-hint {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        /* Center Panel - Display */
        .main-display {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .math-display {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .math-equation {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .math-operand, .math-operator, .math-result {
            display: inline-block;
            animation: fadeInScale 0.5s ease-out;
        }

        .math-operator {
            color: #f093fb;
        }

        .math-result {
            color: #38ef7d;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .explanation {
            font-size: 1.4rem;
            color: var(--text-secondary);
            font-weight: 600;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Right Panel - Hand Visualization */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hand-display {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--shadow);
            flex: 1;
        }

        .hands-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
        }

        .hand {
            width: 120px;
            height: 150px;
            position: relative;
        }

        .hand-label {
            text-align: center;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .fingers {
            display: flex;
            justify-content: space-between;
            align-items: end;
            height: 120px;
        }

        .finger {
            width: 18px;
            height: 80px;
            background: var(--surface);
            border-radius: 10px 10px 5px 5px;
            transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .finger::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: var(--success-gradient);
            border-radius: 10px 10px 5px 5px;
            transition: height 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .finger.up::after {
            height: 100%;
        }

        .finger:nth-child(2) { height: 90px; }
        .finger:nth-child(3) { height: 85px; }
        .finger:nth-child(4) { height: 75px; }
        .finger:nth-child(5) { height: 65px; }

        /* Status Display */
        .status-display {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .connection-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            animation: blink 2s ease-in-out infinite;
        }

        .status-dot.connected {
            background: #38ef7d;
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Loading States */
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #38ef7d;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Celebration Effects */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f093fb;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Error States */
        .error-message {
            background: var(--warning-gradient);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
            font-weight: 600;
            animation: slideInDown 0.5s ease-out;
        }

        @keyframes slideInDown {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto auto;
            }
            
            .left-panel, .right-panel {
                grid-column: 1;
            }
            
            .math-equation {
                font-size: 3rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus States */
        button:focus {
            outline: 3px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }

        /* Advanced Math Mode */
        .advanced-mode {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .advanced-result {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f093fb;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🧮 Maxi Math Adventure</div>
            <button id="backButton" class="back-button">
                <i class="fas fa-arrow-left"></i>
                Back to Menu
            </button>
        </div>

        <!-- Left Panel - Voice Controls -->
        <div class="left-panel">
            <div class="voice-control">
                <button id="micButton" class="mic-button">
                    <i class="fas fa-microphone"></i>
                </button>
                <div id="voiceStatus" class="voice-status">Ready to Listen!</div>
                <div class="voice-hint">Ask me any math question</div>
            </div>

            <div class="status-display">
                <div id="statusText" class="status-text">Ready to Calculate!</div>
                <div class="connection-indicator">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="connectionStatus">Connecting...</span>
                </div>
            </div>
        </div>

        <!-- Center Panel - Math Display -->
        <div class="main-display">
            <div class="math-display">
                <div id="mathEquation" class="math-equation">
                    <span class="math-welcome">🤔 Ask me a math question!</span>
                </div>
                <div id="explanation" class="explanation">
                    I can show finger counting for numbers 0-10, or solve any math problem!
                </div>
            </div>
        </div>

        <!-- Right Panel - Hand Visualization -->
        <div class="right-panel">
            <div class="hand-display">
                <div class="hands-container">
                    <div class="hand">
                        <div class="hand-label">Left Hand</div>
                        <div class="fingers" id="leftHand">
                            <div class="finger"></div>
                            <div class="finger"></div>
                            <div class="finger"></div>
                            <div class="finger"></div>
                            <div class="finger"></div>
                        </div>
                    </div>
                    <div class="hand">
                        <div class="hand-label">Right Hand</div>
                        <div class="fingers" id="rightHand">
                            <div class="finger"></div>
                            <div class="finger"></div>
                            <div class="finger"></div>
                            <div class="finger"></div>
                            <div class="finger"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Celebration Effects Container -->
    <div id="celebration" class="celebration"></div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(console.error);
        }
    </script>

    <!-- Main Application Script -->
    <script>
        class MathPWA {
            constructor() {
                this.socket = null;
                this.isConnected = false;
                this.currentStage = 'idle';
                this.currentProblem = null;
                
                // DOM Elements
                this.micButton = document.getElementById('micButton');
                this.voiceStatus = document.getElementById('voiceStatus');
                this.statusText = document.getElementById('statusText');
                this.statusDot = document.getElementById('statusDot');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.mathEquation = document.getElementById('mathEquation');
                this.explanation = document.getElementById('explanation');
                this.leftHand = document.getElementById('leftHand');
                this.rightHand = document.getElementById('rightHand');
                this.backButton = document.getElementById('backButton');
                this.celebration = document.getElementById('celebration');
                
                this.init();
            }

            async init() {
                this.setupEventListeners();
                this.initWebSocket();
                this.requestFullscreen();
                this.setLandscapeOrientation();
            }

            setupEventListeners() {
                // Mic button
                this.micButton.addEventListener('click', () => {
                    if (!this.isConnected) {
                        this.showError('Not connected to server');
                        return;
                    }
                    this.triggerVoiceInput();
                });

                // Back button with proper mode reset
                this.backButton.addEventListener('click', () => {
                    if (this.socket && this.socket.connected) {
                        this.socket.emit('message', {
                            type: "set_mode",
                            mode: "idle"
                        });
                    }
                    // Small delay to ensure mode is set before navigation
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 100);
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.micButton.click();
                    }
                });
            }

            initWebSocket() {
                console.log('Connecting to Socket.IO...');
                
                try {
                    this.socket = io({
                        transports: ['websocket', 'polling'],
                        upgrade: true
                    });
                    
                    this.socket.on('connect', () => {
                        console.log('Socket.IO connected');
                        this.isConnected = true;
                        this.updateConnectionStatus(true);
                        
                        // Set math_gesture mode
                        this.socket.emit('message', {
                            type: "set_mode",
                            mode: "math_gesture"
                        });
                        
                        // Start ping interval
                        this.pingInterval = setInterval(() => {
                            if (this.socket && this.socket.connected) {
                                this.socket.emit('message', { type: "ping" });
                            }
                        }, 30000);
                    });
                    
                    this.socket.on('audio_chunk', (data) => {
                        this.handleMessage(data);
                    });
                    
                    this.socket.on('state_change', (data) => {
                        this.handleMessage(data);
                    });
                    
                    this.socket.on('response', (data) => {
                        this.handleMessage(data);
                    });
                    
                    this.socket.on('message', (data) => {
                        this.handleMessage(data);
                    });
                    
                    this.socket.on('disconnect', () => {
                        console.log('Socket.IO disconnected');
                        this.isConnected = false;
                        this.updateConnectionStatus(false);
                        clearInterval(this.pingInterval);
                        this.reconnect();
                    });
                    
                    this.socket.on('connect_error', (error) => {
                        console.error('Socket.IO connection error:', error);
                        this.showError('Connection error');
                    });
                    
                } catch (error) {
                    console.error('Failed to create WebSocket:', error);
                    this.showError('Failed to connect');
                    this.reconnect();
                }
            }

            reconnect() {
                setTimeout(() => {
                    if (!this.isConnected) {
                        this.initWebSocket();
                    }
                }, 2000);
            }

            handleMessage(data) {
                console.log('Received message:', data);
                
                switch (data.type) {
                    case 'state_change':
                        this.handleStateChange(data.state, data);
                        break;
                    case 'math_result':
                        this.handleMathResult(data);
                        break;
                    case 'finger_pose':
                        this.updateFingerPose(data.pose);
                        break;
                    case 'transcription':
                        this.handleTranscription(data.text);
                        break;
                    case 'error':
                        this.showError(data.message);
                        break;
                    case 'math_sequence':
                        this.handleMathSequence(data);
                        break;
                }
            }

            handleStateChange(state, data) {
                this.currentStage = state;
                console.log('State changed to:', state);
                
                switch (state) {
                    case 'math_gesture_active':
                        this.updateVoiceStatus('Ready to Listen!', false);
                        this.updateStatus('Ready to Calculate!');
                        break;
                    case 'listening':
                        this.updateVoiceStatus('Listening...', true);
                        this.updateStatus('Listening for your question...');
                        break;
                    case 'processing':
                        this.updateVoiceStatus('Processing...', false);
                        this.updateStatus('Solving your math problem...');
                        this.micButton.innerHTML = '<div class="loading-spinner"></div>';
                        break;
                    case 'speaking':
                        this.updateVoiceStatus('Speaking...', false);
                        this.updateStatus('Explaining the answer...');
                        break;
                    case 'show_operand_a':
                        this.updateStatus('Showing first number...');
                        break;
                    case 'show_operand_b':
                        this.updateStatus('Showing second number...');
                        break;
                    case 'show_result':
                        this.updateStatus('Here\'s the answer!');
                        this.triggerCelebration();
                        break;
                }
            }

            handleMathResult(data) {
                const { A, B, OP, result, explanation, mode } = data;
                this.currentProblem = data;
                
                if (mode === 'finger_counting' && A <= 10 && B <= 10 && result <= 10) {
                    // Basic math with finger visualization
                    this.displayMathEquation(A, OP, B, result);
                    this.updateExplanation(explanation);
                    this.startFingerSequence(data);
                } else {
                    // Advanced math without finger visualization
                    this.displayAdvancedMath(data);
                    this.clearFingers();
                }
            }

            displayMathEquation(A, OP, B, result) {
                const operatorSymbols = {
                    '+': '+',
                    'plus': '+',
                    '-': '−',
                    'minus': '−',
                    '*': '×',
                    'times': '×',
                    '/': '÷',
                    'divided by': '÷'
                };
                
                const symbol = operatorSymbols[OP] || OP;
                
                this.mathEquation.innerHTML = `
                    <span class="math-operand">${A}</span>
                    <span class="math-operator">${symbol}</span>
                    <span class="math-operand">${B}</span>
                    <span class="math-operator">=</span>
                    <span class="math-result">${result}</span>
                `;
            }

            displayAdvancedMath(data) {
                this.mathEquation.innerHTML = `
                    <div class="advanced-mode">
                        <div>Problem: ${data.original_question || 'Advanced Math'}</div>
                        <div class="advanced-result">${data.result}</div>
                    </div>
                `;
                this.updateExplanation(data.explanation || 'Here\'s your answer!');
            }

            async startFingerSequence(data) {
                const { A, B, result, OP } = data;
                
                // Clear fingers first
                this.clearFingers();
                await this.delay(500);
                
                // Show operand A on right hand
                this.showFingers('right', A);
                await this.delay(1000);
                
                // Pause for operator
                await this.delay(800);
                
                // Show operand B on left hand
                this.showFingers('left', B);
                await this.delay(1000);
                
                // Clear for result
                this.clearFingers();
                await this.delay(600);
                
                // Show result (prefer right hand, split if > 5)
                this.showResult(result);
                await this.delay(1500);
                
                this.triggerCelebration();
            }

            showFingers(hand, count) {
                const handElement = hand === 'left' ? this.leftHand : this.rightHand;
                const fingers = handElement.querySelectorAll('.finger');
                
                // Clear first
                fingers.forEach(finger => finger.classList.remove('up'));
                
                // Show fingers with stagger effect
                for (let i = 0; i < Math.min(count, 5); i++) {
                    setTimeout(() => {
                        fingers[i].classList.add('up');
                    }, i * 120);
                }
            }

            showResult(result) {
                if (result <= 5) {
                    this.showFingers('right', result);
                } else if (result <= 10) {
                    this.showFingers('right', 5);
                    setTimeout(() => {
                        this.showFingers('left', result - 5);
                    }, 300);
                } else {
                    // For results > 10, just show max on both hands
                    this.showFingers('right', 5);
                    this.showFingers('left', 5);
                }
            }

            clearFingers() {
                const allFingers = document.querySelectorAll('.finger');
                allFingers.forEach(finger => finger.classList.remove('up'));
            }

            updateFingerPose(pose) {
                if (pose.right) {
                    const rightFingers = this.rightHand.querySelectorAll('.finger');
                    pose.right.forEach((up, index) => {
                        if (index < rightFingers.length) {
                            rightFingers[index].classList.toggle('up', up === 1);
                        }
                    });
                }
                
                if (pose.left) {
                    const leftFingers = this.leftHand.querySelectorAll('.finger');
                    pose.left.forEach((up, index) => {
                        if (index < leftFingers.length) {
                            leftFingers[index].classList.toggle('up', up === 1);
                        }
                    });
                }
            }

            triggerVoiceInput() {
                if (this.socket && this.socket.connected) {
                    this.socket.emit('message', {
                        type: "math_gesture_wake"
                    });
                }
            }

            updateVoiceStatus(text, listening) {
                this.voiceStatus.textContent = text;
                this.micButton.classList.toggle('listening', listening);
                
                if (!listening) {
                    this.micButton.innerHTML = '<i class="fas fa-microphone"></i>';
                }
            }

            updateStatus(text) {
                this.statusText.textContent = text;
            }

            updateConnectionStatus(connected) {
                this.statusDot.classList.toggle('connected', connected);
                this.connectionStatus.textContent = connected ? 'Connected' : 'Disconnected';
            }

            updateExplanation(text) {
                this.explanation.textContent = text;
            }

            handleTranscription(text) {
                this.mathEquation.innerHTML = `<span class="math-question">"${text}"</span>`;
                this.updateStatus('Processing your question...');
            }

            showError(message) {
                const errorElement = document.createElement('div');
                errorElement.className = 'error-message';
                errorElement.textContent = message;
                
                // Insert error at the top of math display
                this.mathDisplay.insertBefore(errorElement, this.mathDisplay.firstChild);
                
                // Remove after delay
                setTimeout(() => {
                    errorElement.remove();
                }, 5000);
            }

            triggerCelebration() {
                // Clear any existing confetti
                this.celebration.innerHTML = '';
                
                // Create new confetti
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.animationDelay = `${Math.random() * 2}s`;
                    confetti.style.backgroundColor = this.getRandomColor();
                    this.celebration.appendChild(confetti);
                }
                
                // Clear after animation
                setTimeout(() => {
                    this.celebration.innerHTML = '';
                }, 3000);
            }

            getRandomColor() {
                const colors = [
                    '#f093fb', '#f5576c', '#667eea', 
                    '#764ba2', '#38ef7d', '#11998e'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            requestFullscreen() {
                // Only try to go fullscreen after a user interaction
                document.addEventListener('click', () => {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(console.error);
                    }
                }, { once: true });
            }

            setLandscapeOrientation() {
                // Lock to landscape on mobile devices if supported
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {
                        console.log('Orientation lock not supported');
                    });
                }
            }
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.mathApp = new MathPWA();
        });
    </script>
</body>
</html>
