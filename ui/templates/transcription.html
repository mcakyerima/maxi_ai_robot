<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxi AI Transcription</title>
    <style>
        :root {
            --primary: #6e48aa;
            --secondary: #9d50bb;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --accent: #00e5ff;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }
        
        h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff5f56;
        }
        
        .status-indicator.connected {
            background: #27c93f;
        }
        
        .transcription-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            min-height: 300px;
            position: relative;
            overflow: hidden;
        }
        
        .transcription-text {
            font-size: 1.2rem;
            white-space: pre-wrap;
            line-height: 1.8;
        }
        
        .interim-text {
            color: rgba(255,255,255,0.7);
            border-bottom: 1px dashed rgba(255,255,255,0.2);
        }
        
        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to top, var(--card-bg), transparent);
            pointer-events: none;
        }
        
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Maxi AI</h1>
            <p>Real-time Speech Transcription</p>
            <div class="status">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </header>
        
        <main>
            <div class="transcription-container">
                <div class="transcription-text" id="transcription-text"></div>
                <div class="gradient-overlay"></div>
            </div>
        </main>
        
        <footer>
            <p>Transcription powered by Maxi AI</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            const transcriptionText = document.getElementById('transcription-text');
            
            // WebSocket connection
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsHost = window.location.hostname || 'localhost';
            const wsPort = 8765;
            const wsUrl = `${wsProtocol}//${wsHost}:${wsPort}`;
            
            let socket;
            let reconnectAttempts = 0;
            const maxReconnectAttempts = 5;
            const reconnectDelay = 3000;
            
            function connect() {
                socket = new WebSocket(wsUrl);
                
                socket.onopen = () => {
                    reconnectAttempts = 0;
                    statusIndicator.classList.add('connected');
                    statusText.textContent = 'Connected';
                    console.log('WebSocket connected');
                };
                
                socket.onclose = (event) => {
                    statusIndicator.classList.remove('connected');
                    statusText.textContent = 'Disconnected';
                    
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        const delay = reconnectAttempts * reconnectDelay;
                        console.log(`Connection closed. Reconnecting in ${delay/1000} seconds...`);
                        setTimeout(connect, delay);
                    } else {
                        console.log('Max reconnection attempts reached');
                    }
                };
                
                socket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };
                
                socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'transcription') {
                            if (data.is_final) {
                                // Final transcription
                                const finalElement = document.createElement('div');
                                finalElement.textContent = data.text;
                                transcriptionText.appendChild(finalElement);
                            } else {
                                // Interim result
                                let interimElement = document.querySelector('.interim-text');
                                if (!interimElement) {
                                    interimElement = document.createElement('div');
                                    interimElement.className = 'interim-text';
                                    transcriptionText.appendChild(interimElement);
                                }
                                interimElement.textContent = data.text;
                            }
                            
                            // Auto-scroll to bottom
                            transcriptionText.scrollTop = transcriptionText.scrollHeight;
                        }
                        
                        // Handle other message types if needed
                        // e.g., connection_established, error, etc.
                        
                    } catch (e) {
                        console.error('Error parsing WebSocket message:', e);
                    }
                };
            }
            
            // Initial connection
            connect();
            
            // Keep connection alive
            setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'ping' }));
                }
            }, 25000);
        });
    </script>
</body>
</html>
